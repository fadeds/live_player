name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="dev.${CODE}"
          fi
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          KS_PASS="${KEYSTORE_PASSWORD:-cctv123456}"
          KS_ALIAS="${KEY_ALIAS:-cctv}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub secret."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "No keystore secret found, generating a temporary one."
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=LivePlayer, OU=CI, O=CI, L=CI, ST=CI, C=CN"
          fi
          {
            echo "CCTV_KSPASS=$KS_PASS"
            echo "CCTV_KEYPASS=$KS_PASS"
            echo "CCTV_KEYALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PVERSION_CODE=${{ steps.ver.outputs.code }} -PVERSION_NAME=${{ steps.ver.outputs.name }}

      - name: Rename APK with version
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "LivePlayer-v${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivePlayer-v${{ steps.ver.outputs.name }}
          path: LivePlayer-v${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LivePlayer-v${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
