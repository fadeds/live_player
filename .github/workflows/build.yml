name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          KS_PASS="${KEYSTORE_PASSWORD:-cctv123456}"
          KS_ALIAS="${KEY_ALIAS:-cctv}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub secret."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "No keystore secret found, generating a temporary one."
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=CctvTv, OU=CI, O=CI, L=CI, ST=CI, C=CN"
          fi
          {
            echo "CCTV_KSPASS=$KS_PASS"
            echo "CCTV_KEYPASS=$KS_PASS"
            echo "CCTV_KEYALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
